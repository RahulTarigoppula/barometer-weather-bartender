# Deploy the Vite app to GitHub Pages on every push to main.
# Heavy gates (lint, types, coverage, licences, bundle budget, Playwright) live in ci.yml,
# so a flaky headless browser can never block a deploy.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false # never cancel a live production deploy

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      TZ: Asia/Kolkata
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run
      - name: Build (served from /<repo>/)
        run: npm run build
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
      - name: SPA fallback for deep links (harmless with hash routing)
        run: cp dist/index.html dist/404.html && rm -f dist/stats.json
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
